local_changes:
- Explicit accelerometer density 70 ug/sqrt(Hz) (conservative scalar IIM-42653 Z-axis
  PSD); corrects RMS-as-density units, retains nonzero noise and existing protection
  limits.
- Native noisy 1000Hz IMU is routed through a four-sample accumulator before the
  existing 250Hz MAVLink consumer, followed by reviewed signed 16-bit accel FIFO
  saturation; source seq/time, nonzero noise and control limits retained. Original
  raw native samples remain available separately.
- Independently named pinned native IMU widens timestamp arithmetic before the
  2147.484 s signed-int boundary and releases its update event normally; native
  channels, noise, physics and relay rejection rules are retained.
- VIO input correction (2026-10-19), URDF adds livox_imu_frame at the physical
  sensor origin, consistent with sensors.yaml; SDF sensor poses remain unchanged.
- RGB image and CameraInfo publisher histories keep_last(32) retain bounded VIO
  burst input; physical sampling, noise and message timestamps are unchanged.
