# EasyFly M4.1 TrackTarget 跟随配置
target_tracking:
  # ---- 话题 ----
  input_topic: /target_positions      # M5 输出 (odom 系)
  uav_state_topic: /uav_state         # 无人机位置 (最近目标模式/跟随点计算)

  # ---- 跟随行为 ----
  reissue_threshold: 1.0              # 跟随点偏差超过此值才重发航点 [m] (静止零重发)
  default_follow_distance: 4.0        # goal 未指定时 [m]
  default_follow_height: 1.5          # goal 未指定时 [m, 相对目标]
  max_altitude: 2.5                   # 硬上限 [m] (SLAM 2.5m 盲区约束, Q22)

  # ---- 目标观测安全边界 ----
  # 允许当前 SITL 行人约 1m/s 的运动和少量深度噪声；异常观测永远不会
  # 因为连续出现而被放行。超过上限的观测被丢弃，持续异常最终触发
  # lost_timeout → 取消子航点 + 悬停 + ABORTED。
  max_target_speed: 3.0               # 目标合理最大运动速度 [m/s]
  max_target_jump: 2.0                # 任意单帧最大位移 [m]
  jump_guard_margin: 0.5              # 观测/调度抖动余量 [m]
  max_observation_gap: 1.0            # 速度预算 dt 上限 [s] (拒绝帧也更新)

  # ---- 跟随任务安全边界 ----
  max_follow_radius: 35.0             # 相对跟随开始位置的最大水平半径 [m]
  state_timeout: 1.0                  # /uav_state 最大允许新鲜度 [s]
  child_cancel_timeout: 5.0           # 单次子航点取消等待上限 [s]
  child_cancel_max_wait: 30.0         # 终止跟随等待子航点终态的总上限 [s]

  # ---- 丢失处理 ----
  first_seen_timeout: 15.0            # 发起后多久找不到目标则 abort [s]
  lost_timeout: 5.0                   # 丢失超过此值: cancel 航点 + 悬停 + abort [s]
  reacquire_radius: 2.5               # id 轮换重捕获半径 [m] (SORT 会重新分配 id, Q19)
