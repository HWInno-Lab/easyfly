# EasyFly P4 障碍表征配置 (M4.0)
# 输入为 easyfly_pointcloud_filter 的 base_link 系点云, 本节点变换到 world 系处理
semantic_map:
  # ---- 话题/服务 ----
  input_topic: /pointcloud_filtered
  uav_state_topic: /uav_state     # 独立飞行状态，用于安全地面初始化
  output_topic: /obstacles            # ObstacleInfoArray
  nonground_topic: /pointcloud_nonground # trusted ground-removed cloud for EGO
  grid_topic: /occupancy_grid         # OccupancyGrid (供全局规划)
  marker_topic: /obstacle_markers     # RViz 立方体
  service_name: /get_obstacles        # GetObstacles srv

  # ---- 坐标系 ----
  world_frame: odom                   # 障碍输出系 (低空任务短航程, odom 即可; 全局建图需求出现再切 map)
  base_frame: base_link               # 车辆位姿参考系 (用于 TF 跳变守卫与地面相对高度校验)
  ground_model_frame: ""              # 空值保留 world_frame；场景可声明稳定地面模型系。

  # ---- 地面平面候选与可信跟踪 ----
  plane_distance_threshold: 0.12      # 地面平面厚度 [m] (内点距离阈值)
  plane_max_tilt_rad: 0.15            # 候选平面最大相对水平倾角 [rad]
  plane_min_inliers: 50               # 候选最少内点数
  plane_min_inlier_ratio: 0.15        # 候选最少内点比例
  # Explicit indoor alternative: strict 0.02m fit, 1--3m annulus, >=120
  # independent 0.2m cells, >=200 points, all 8 sectors, >=90% cell support,
  # clearance 0.03--0.25m, tilt <=0.10rad, >=5 consistent disarmed frames.
  # The original full-frame 0.15 ratio remains the default C++ policy and is
  # unchanged. Above-plane returns remain in the complete obstacle cloud.
  ground_spatial_support_enabled: true
  # 实测落地净空约 0.053-0.054m；0.03m 保留约 0.02m 裕量并拒绝零/机体同高平面
  ground_min_clearance: 0.03          # 地面相对 base_frame 的最小垂直间距 [m]
  ground_max_distance_below_vehicle: 8.0  # 地面相对车辆的最大间距 [m]
  ground_init_consecutive_frames: 3    # 初始化所需连续一致候选帧
  ground_init_max_z_difference: 0.25    # 初始化候选平面最大高度差 [m]
  ground_init_max_normal_angle_rad: 0.12 # 初始化候选法向最大夹角 [rad]
  ground_max_innovation_z: 0.45         # 已初始化候选相对历史模型最大高度创新 [m]
  ground_max_innovation_angle_rad: 0.15 # 已初始化候选法向最大创新 [rad]
  ground_smoothing_alpha: 0.25          # 合法候选更新 EMA 系数
  # fresh connected+pose_valid+disarmed permits initialization; armed restarts fail closed
  ground_init_state_timeout: 1.0         # /uav_state 新鲜度 [s]
  tf_guard_jump_distance: 1.0           # base_frame 水平平移跳变门限 [m]
  tf_guard_init_consecutive_frames: 3   # TF 基线初始化连续帧
  tf_guard_reject_limit: 10             # 连续跳变后允许重置基线的帧数
  obstacle_z_max: 4.0                 # 关心高度上限 [m, 离拟合地面]

  # ---- 欧式聚类 ----
  cluster_tolerance: 0.6              # 簇内点间距阈值 [m] (兼顾大物体成簇与近距目标不合并)
  cluster_min_points: 5               # 当前帧最小簇点数
  cluster_max_points: 100000
  nonground_voxel_size: 0.10          # /pointcloud_nonground 发布前体素叶尺寸 [m]
  input_timeout: 1.0                  # 输入无新帧超时即 invalid (node ROS time) [s]
  cloud_stamp_timeout: 1.0            # 输入点云时间戳最大允许旧度 [s]
  cloud_stamp_future_tolerance: 0.2   # 输入点云未来时间容差 [s]
  clock_jump_forward_limit: 10.0      # ROS 时钟异常前跳门限 [s]
  max_input_points: 200000            # 单帧点数上限，超限拒绝并 invalid
  # Must equal GridMap grid_map/max_trusted_cloud_points (200000).  The
  # semantic callback counts current voxels and complete prediction footprints
  # together before publishing.
  max_nonground_points: 200000        # 当前帧+预测非地面点总上限，超限拒绝并 invalid
  max_obstacle_size: 8.0              # 单簇包围盒上界 [m], 超过视为地面残留/噪声链

  # ---- 动态障碍跨帧跟踪与短时预测 ----
  # 连续、无歧义、方向一致的当前帧速度证据才会发布 is_dynamic=true；异常帧
  # 只保留静态观测。预测点追加到 /pointcloud_nonground，受总点数预算约束；
  # 预算按完整九点平面 footprint 分配，余数不会形成 partial step。
  dynamic_association_gate: 1.5       # 簇中心最大关联距离 [m]
  dynamic_association_ambiguity_distance: 0.10 # 关联距离歧义门 [m]
  dynamic_association_cost_margin: 0.10 # 归一化匹配 cost 歧义门 (无量纲)
  dynamic_association_z_gate: 1.0     # 高度兼容门 [m]; 关联代价仍以 XY 为主
  dynamic_association_xy_size_ratio: 6.0 # 稀疏点云水平 footprint 尺寸比上限
  dynamic_association_z_size_ratio: 8.0  # 高度切片尺寸比上限
  dynamic_min_dt: 0.03                # 速度估计最小时间差 [s]
  dynamic_max_dt: 1.5                 # 速度估计最大时间差 [s]
  dynamic_speed_deadband: 0.20        # 低于此速度视为静态抖动 [m/s]
  dynamic_max_speed: 5.0              # 超速样本 fail-safe [m/s]
  dynamic_min_direction_cosine: 0.60  # 当前帧连续速度方向一致性门限 (<=0 回安全默认)
  dynamic_min_confirmations: 2        # 至少连续两次有效速度更新
  dynamic_velocity_ema_alpha: 0.50    # 有界 XY 速度 EMA 系数
  dynamic_min_displacement: 0.15      # 动态确认所需累计 XY 位移 [m]
  dynamic_dormant_max_misses: 2        # 允许的短时漏簇历史帧数; 漏帧不发布预测
  dynamic_prediction_horizon: 1.5     # 前向扫掠时域 [s]
  dynamic_prediction_steps: 8         # 扫掠离散步数
  dynamic_max_prediction_points: 256  # 所有动态障碍共享的完整 footprint 点预算
  dynamic_prediction_min_half_x: 0.20  # confirmed dynamic 最小 X 半边长 [m]
  dynamic_prediction_min_half_y: 0.20  # confirmed dynamic 最小 Y 半边长 [m]
  dynamic_prediction_uncertainty_growth: 0.10 # 包络随预测时间增长 [m/s]
  dynamic_prediction_max_uncertainty: 0.50 # 包络增长上限 [m]
  # Predictor-only size gate.  Oversized/environmental clusters remain in
  # static /obstacles and occupancy output, but cannot acquire swept velocity.
  dynamic_max_bbox_size_x: 2.5       # 单个动态目标 X 尺寸上限 [m]
  dynamic_max_bbox_size_y: 2.5       # 单个动态目标 Y 尺寸上限 [m]
  dynamic_max_bbox_size_z: 2.5       # 单个动态目标 Z 尺寸上限 [m]

  # ---- 占据栅格 ----
  inflate_radius: 0.7                 # 障碍足迹膨胀 [m] (含栅格/跟踪误差裕量；低于 0.7 将被提升)
  verbose: true                      # 逐帧聚类统计日志 (调参用)
  grid_persist_frames: 20             # 占据保持帧数 (≈3s @7Hz; 漏检不立即可穿越)
  grid_resolution: 0.2                # [m/cell]
  grid_width: 100.0                   # 以 odom 原点为中心 [m]
  grid_height: 100.0
